<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8f6">
  <title>小九的异色进度单</title>
  <style>
    :root{--ink:#4d3e43;--muted:#927a82;--line:#ecd9df;--pink:#df7596;--pink2:#ed91ad;--danger:#d95469;--bg:#fff8f6}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fff5f2,#fffaf8 44%,#fdf8f7);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input{font:inherit}input,select,textarea{font-size:16px!important}.hidden{display:none!important}
    .app{position:relative;isolation:isolate;width:min(100%,720px);min-height:100dvh;margin:auto;padding:24px 16px calc(78px + env(safe-area-inset-bottom));overflow:hidden}.orb{position:absolute;z-index:-1;border-radius:999px;opacity:.58}.orb.a{width:210px;height:210px;right:-75px;top:-78px;background:#ffd5df}.orb.b{width:160px;height:160px;left:-110px;top:280px;background:#ddd4ff}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.eyebrow{color:#cc6f8d;font-size:11px;font-weight:900;letter-spacing:.14em}.top h1{margin:5px 0 4px;font-size:clamp(28px,8vw,38px);line-height:1.08;font-weight:950;letter-spacing:-.04em}.top p{margin:0;color:#9a7e87;font-size:13px}.save-pill{flex:none;border:1px solid #efd9df;border-radius:999px;background:#ffffffc9;padding:7px 10px;color:#8d7179;font-size:11px;font-weight:850}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0 14px}.stat{min-width:0;border:1px solid #ecd7dd;border-radius:20px;background:#ffffffd8;padding:12px;box-shadow:0 8px 24px #7849560d}.stat span{display:block;overflow:hidden;color:#977d84;font-size:11px;font-weight:750;white-space:nowrap}.stat strong{display:block;margin-top:3px;font-size:25px;line-height:1}.stat.hot{border-color:#efc1ce;background:linear-gradient(145deg,#fff3f6,#ffe7ed)}.stat.hot strong{color:#d46284}
    .panel{border:1px solid var(--line);border-radius:22px;background:#ffffffc9;box-shadow:0 12px 34px #6d46500d;overflow:hidden}.panel summary{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;cursor:pointer;list-style:none;font-size:14px;font-weight:850}.panel summary::-webkit-details-marker,.order summary::-webkit-details-marker{display:none}.panel summary b{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:6px;border-radius:999px;background:#f8e5eb;color:#cb6887;font-size:11px}.panel[open] .arrow,.order[open] .arrow{transform:rotate(180deg)}.arrow{display:inline-block;color:#92757f;transition:transform .2s}.panel-body{border-top:1px dashed #ecd8de;padding:14px}.add-pet{display:flex;gap:8px}.input{width:100%;height:42px;border:1px solid #e5d1d7;border-radius:13px;background:#fff;padding:0 12px;color:var(--ink);outline:none}.input:focus{border-color:#d987a0;box-shadow:0 0 0 3px #f5cbd844}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 14px;color:#765d65;font-weight:800}.btn.primary{border:0;background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff;box-shadow:0 7px 17px #d76b8b2b}.btn.ghost{border:0;background:transparent}.btn.danger{border-color:#c84d64;background:var(--danger);color:#fff}.btn:disabled{opacity:.42}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:#faedf1;padding:7px 8px 7px 11px;color:#765c64;font-size:12px;font-weight:750}.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:#ffffffb3;color:#b38a95}.chip button:disabled{opacity:.3}.empty-mini{margin-top:12px;border:1px dashed #e7cfd6;border-radius:14px;padding:16px;color:#a1878e;font-size:12px;text-align:center}
    .actions{display:grid;grid-template-columns:1.2fr 1fr;gap:9px;margin:12px 0}.actions .btn{height:46px;border-radius:16px}.backup{display:flex;justify-content:center;gap:4px;margin:0 0 12px}.backup .btn{height:36px;padding:0 9px;border:0;background:transparent;color:#8f727b;font-size:12px}.search{position:relative;display:flex;align-items:center;margin:0 0 12px}.search .mag{position:absolute;left:13px;color:#b18e98}.search input{padding-left:39px;padding-right:58px;background:#ffffffc7}.search button{position:absolute;right:7px;height:30px;border:0;border-radius:10px;background:#f8e8ed;padding:0 9px;color:#9b7180;font-size:11px;font-weight:800}
    .tabs{display:grid;grid-template-columns:1fr 1fr;height:45px;margin-bottom:13px;border:1px solid var(--line);border-radius:16px;background:#ffffffb8;padding:4px}.tab{border:0;border-radius:12px;background:transparent;color:#987b84;font-weight:850}.tab.active{background:#fff;color:#cf6e8b;box-shadow:0 3px 12px #6b444f14}.list{display:grid;gap:12px}.order{border:1px solid #e7d2d8;border-radius:24px;padding:16px;box-shadow:0 12px 30px #69444f0f}.rose{background:linear-gradient(145deg,#fff7f8,#fde8ee)}.lilac{background:linear-gradient(145deg,#fbf8ff,#eee9ff)}.sky{background:linear-gradient(145deg,#f8fcff,#e9f4ff)}.mint{background:linear-gradient(145deg,#f9fffc,#e8f8f0)}.peach{background:linear-gradient(145deg,#fffaf7,#ffede3)}.butter{background:linear-gradient(145deg,#fffef7,#faf2d9)}.order summary{cursor:pointer;list-style:none}.sum-top{display:flex;justify-content:space-between;gap:10px}.sum-top h3{display:inline;margin:0;font-size:19px;font-weight:950}.sub{margin:4px 0 0;overflow:hidden;color:#8d777d;font-size:12px;text-overflow:ellipsis;white-space:nowrap}.done{display:inline-flex;align-items:center;margin-left:6px;border-radius:999px;background:#ffffffc7;padding:4px 7px;color:#4f9a76;font-size:10px;font-weight:850}.progress-row{display:flex;align-items:center;gap:10px;margin-top:12px}.track{height:8px;flex:1;border-radius:999px;background:#ffffffbd;overflow:hidden}.fill{height:100%;border-radius:inherit;background:#e886a3}.percent{width:40px;text-align:right;font-size:13px;font-weight:900}.counts{display:flex;justify-content:space-between;margin-top:7px;color:#8d777d;font-size:12px;font-weight:750}.counts b{color:#c55f7e}.details{padding-top:13px}.card-actions{display:flex;justify-content:flex-end;gap:2px;margin:-4px 0 8px}.card-actions .btn{height:34px;padding:0 9px;border:0;background:transparent}.card-actions .delete{color:#bd5269}.pet-rows{display:grid;gap:10px}.pet-row{display:flex;align-items:center;gap:8px;border:1px solid #ffffffd0;border-radius:16px;background:#ffffff8f;padding:10px}.pet-row.complete{opacity:.72}.pet-info{min-width:0;flex:1}.pet-name{display:flex;align-items:center;gap:6px;font-weight:850}.pet-meta{margin-top:2px;color:#8d777d;font-size:12px}.counter{display:flex;flex:none;align-items:center;gap:2px;border:1px solid #dfc3ca;border-radius:12px;background:#ffffffc7;padding:2px}.counter button{width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#765d65;font-size:21px}.counter button.plus{background:#e987a4;color:#fff}.counter button:disabled{opacity:.35}.counter strong{min-width:24px;text-align:center}.foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;border-top:1px solid #ffffffb3;padding-top:12px;color:#7f6a70;font-size:12px;font-weight:750}.foot .btn{height:34px;padding:0 9px;border:0;background:transparent}.empty{display:grid;place-items:center;min-height:230px;border:1px dashed #e6ced5;border-radius:24px;background:#ffffff7a;padding:30px;text-align:center}.empty h2{margin:0 0 5px;font-size:17px}.empty p{margin:0;color:#9b838a;font-size:12px}
    dialog{width:min(calc(100% - 28px),430px);max-height:88dvh;border:1px solid #efccd6;border-radius:26px;background:#fffaf8;padding:0;color:var(--ink);box-shadow:0 24px 70px #3f27304d}dialog::backdrop{background:#3a303399}.modal{padding:20px;overflow:auto}.modal h2{margin:0 0 5px;font-size:22px}.modal-desc{margin:0 0 18px;color:#8d777d;font-size:13px}.field{display:grid;gap:6px;margin-bottom:14px;font-size:13px;font-weight:850}.pick-list{display:grid;gap:8px;max-height:42dvh;overflow:auto}.pick{display:grid;grid-template-columns:auto minmax(0,1fr) 72px auto;align-items:center;gap:9px;border:1px solid #ead8dd;border-radius:15px;background:#ffffffad;padding:9px 10px}.pick.on{border-color:#e9aab9;background:#fff1f5}.pick input[type=checkbox]{width:19px;height:19px;accent-color:#e77f9e}.pick-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}.qty{width:72px!important;text-align:center}.ball-paw{display:grid;place-items:center;width:24px;height:24px;flex:none;border:0;background:transparent;padding:2px;color:#40373a;touch-action:manipulation;-webkit-touch-callout:none;user-select:none}.ball-paw svg{width:20px;height:20px;fill:currentColor;stroke:currentColor;stroke-width:1.8}.ball-options{display:grid;gap:9px;margin-top:17px}.ball-option{height:46px;justify-content:flex-start;border:2px solid transparent}.ball-option svg{width:20px;height:20px;flex:none}.ball-option.king{color:#aa7315;background:linear-gradient(#fffaf8,#fffaf8) padding-box,linear-gradient(105deg,#ff861c,#ffd64d,#e99b13) border-box}.ball-option.prism{color:#6f5fc4;background:linear-gradient(#fffaf8,#fffaf8) padding-box,linear-gradient(105deg,#28cfe5,#65d989,#f3d75a,#f49bc1,#7562d8) border-box}.ball-option-label{font-weight:700}.ball-option.king .ball-option-label{background:linear-gradient(100deg,#f58a20,#f7b72c,#e59b16);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}.ball-option.prism .ball-option-label{background:linear-gradient(100deg,#20bdd5,#58c87e,#dcbf35,#df769f,#715cc2);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}.ball-option.active{box-shadow:0 4px 14px #6d46501f}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.warning{text-align:center}.warning h2{margin-top:4px}.warning-name{font-weight:900;color:#a54156}
    .toast{position:fixed;z-index:20;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);border-radius:999px;background:#4c3b41e8;padding:9px 14px;color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(min-width:640px){.app{padding:38px 24px 80px}.order{padding:19px}.stat{padding:15px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <div class="orb a"></div><div class="orb b"></div>
    <section class="top"><div><div class="eyebrow">✦ SHINY PETS</div><h1>小九的异色进度单</h1><p><span id="seasonLabel">当前赛季</span> · 异色抓取进度清单</p></div><div class="save-pill">本机保存</div></section>
    <section class="stats"><div class="stat"><span>总需求</span><strong id="sumTarget">0</strong></div><div class="stat"><span>已经抓到</span><strong id="sumCaught">0</strong></div><div class="stat hot"><span>还差</span><strong id="sumLeft">0</strong></div></section>
    <details class="panel"><summary><span>🐾 本赛季精灵 <b id="petCount">0</b></span><span class="arrow">⌄</span></summary><div class="panel-body"><form id="petForm" class="add-pet"><input id="petName" class="input" aria-label="精灵名称" maxlength="24"><button class="btn primary" type="submit">＋ 添加</button></form><div id="petArea"></div></div></details>
    <div class="actions"><button id="newOrder" class="btn primary">＋ 新建老板卡</button><button id="newSeason" class="btn">✦ 开始新赛季</button></div>
    <div class="backup"><button id="exportBtn" class="btn">⇩ 导出备份</button><label class="btn" for="importFile">⇧ 导入备份</label><input id="importFile" class="hidden" type="file" accept="application/json,.json"></div>
    <div class="search"><span class="mag">⌕</span><input id="searchInput" class="input" placeholder="搜索老板或精灵"><button id="clearSearch" class="hidden">清除</button></div>
    <div class="tabs"><button class="tab active" data-tab="active">进行中 <span id="activeCount">0</span></button><button class="tab" data-tab="archived">已归档 <span id="archivedCount">0</span></button></div>
    <section id="orderList" class="list"></section>
  </main>

  <dialog id="orderDialog"><form id="orderForm" class="modal"><h2 id="orderTitle">新建老板卡</h2><p class="modal-desc">选择指定精灵并填写需求数量。</p><label class="field">老板 / 客户名<input id="customerInput" class="input" maxlength="30"></label><label class="field">备注（选填）<input id="noteInput" class="input" maxlength="80"></label><div class="field">指定精灵与需求</div><div id="orderPicks" class="pick-list"></div><div class="modal-actions"><button type="button" class="btn ghost" data-close="orderDialog">取消</button><button id="saveOrderBtn" class="btn primary" type="submit">保存老板卡</button></div></form></dialog>
  <dialog id="seasonDialog"><form id="seasonForm" class="modal"><h2>开始新赛季</h2><p class="modal-desc">旧赛季的老板卡和归档记录将保留。</p><label class="field">赛季名称<input id="seasonInput" class="input" maxlength="30"></label><div class="modal-actions"><button type="button" class="btn ghost" data-close="seasonDialog">取消</button><button class="btn primary" type="submit">创建赛季</button></div></form></dialog>
  <dialog id="deleteDialog"><div class="modal warning"><h2>删除老板卡？</h2><p>将永久删除 <span id="deleteName" class="warning-name"></span> 的老板卡及全部抓取记录。</p><div class="modal-actions"><button type="button" class="btn" data-close="deleteDialog">取消</button><button id="confirmDelete" type="button" class="btn danger">确认删除</button></div></div></dialog>
  <dialog id="ballDialog"><div class="modal"><h2 id="ballPetName"></h2><div class="ball-options"><button type="button" class="btn ball-option king" data-ball-value="国王球"><span id="kingPaw"></span><span class="ball-option-label">国王球</span></button><button type="button" class="btn ball-option prism" data-ball-value="棱镜球"><span id="prismPaw"></span><span class="ball-option-label">棱镜球</span></button></div><div class="modal-actions"><button id="resetBall" type="button" class="btn ghost" data-ball-value="">改回赛季球</button><button type="button" class="btn ghost" data-close="ballDialog">取消</button></div></div></dialog>
  <div id="toast" class="toast"></div>

  <script>
  (()=>{
    'use strict';
    const KEY='xiaojiu-season-pets-offline-v1';
    const $=s=>document.querySelector(s);
    const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);
    const now=()=>new Date().toISOString();
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const attr=v=>esc(v);
    function starter(){const id=uid();return{currentSeasonId:id,seasons:[{id,name:'当前赛季',pets:[],createdAt:now()}],orders:[]}}
    function valid(v){return v&&Array.isArray(v.seasons)&&Array.isArray(v.orders)&&typeof v.currentSeasonId==='string'}
    let data=(()=>{try{const x=JSON.parse(localStorage.getItem(KEY));return valid(x)?x:starter()}catch{return starter()}})();
    let tab='active',query='',openCards=new Set(),editingId=null,deletingId=null,ballTarget=null;
    const totals=o=>{const target=o.items.reduce((s,i)=>s+Number(i.target||0),0),caught=o.items.reduce((s,i)=>s+Number(i.caught||0),0);return{target,caught,left:Math.max(0,target-caught)}};
    const currentSeason=()=>data.seasons.find(s=>s.id===data.currentSeasonId)||data.seasons[0];
    const seasonOf=o=>data.seasons.find(s=>s.id===o.seasonId);
    function save(){localStorage.setItem(KEY,JSON.stringify(data))}
    function mutate(fn){fn();save();render()}
    function tone(name){const a=['rose','lilac','sky','mint','peach','butter'];let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))|0;return a[Math.abs(h)%a.length]}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1600)}
    function pawSvg(ball,key='paw'){const id=('paw-'+key).replace(/[^a-zA-Z0-9_-]/g,'');const shape='<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>';if(ball==='国王球')return `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="${id}" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c77408"/><stop offset="28%" stop-color="#f29a18"/><stop offset="58%" stop-color="#ffb52e"/><stop offset="82%" stop-color="#ffe16a"/><stop offset="100%" stop-color="#fff1a0"/></linearGradient></defs><g fill="url(#${id})" stroke="url(#${id})">${shape}</g></svg>`;if(ball==='棱镜球')return `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="${id}" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3158e8"/><stop offset="24%" stop-color="#00cfe8"/><stop offset="46%" stop-color="#61e8b5"/><stop offset="67%" stop-color="#ffe36b"/><stop offset="84%" stop-color="#ff86c8"/><stop offset="100%" stop-color="#8065ec"/></linearGradient></defs><g fill="url(#${id})" stroke="url(#${id})">${shape}</g></svg>`;return `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="currentColor">${shape}</g></svg>`}
    function ballPawHtml(item,orderId,archived){return `<button type="button" class="ball-paw" data-ball-paw data-order="${attr(orderId)}" data-item="${attr(item.id)}" aria-label="设置${attr(item.petName)}使用的球" ${archived?'disabled':''}>${pawSvg(item.ball||'',item.id)}</button>`}
    function openBallChooser(orderId,itemId){const o=data.orders.find(x=>x.id===orderId),i=o&&o.items.find(x=>x.id===itemId);if(!i)return;ballTarget={orderId,itemId};$('#ballPetName').textContent=i.petName;$('#kingPaw').innerHTML=pawSvg('国王球','king-choice');$('#prismPaw').innerHTML=pawSvg('棱镜球','prism-choice');document.querySelectorAll('[data-ball-value]').forEach(b=>b.classList.toggle('active',!!b.dataset.ballValue&&b.dataset.ballValue===i.ball));$('#resetBall').classList.toggle('hidden',i.ball!=='国王球'&&i.ball!=='棱镜球');$('#ballDialog').showModal()}
    function render(){
      const season=currentSeason();$('#seasonLabel').textContent=season.name;$('#petCount').textContent=season.pets.length;
      const active=data.orders.filter(o=>!o.archived);const sum=active.reduce((a,o)=>{const t=totals(o);a.target+=t.target;a.caught+=t.caught;a.left+=t.left;return a},{target:0,caught:0,left:0});
      $('#sumTarget').textContent=sum.target;$('#sumCaught').textContent=sum.caught;$('#sumLeft').textContent=sum.left;$('#activeCount').textContent=active.length;$('#archivedCount').textContent=data.orders.length-active.length;
      renderPets();renderOrders();
    }
    function renderPets(){const season=currentSeason();const active=data.orders.filter(o=>!o.archived&&o.seasonId===season.id);$('#petArea').innerHTML=season.pets.length?`<div class="chips">${season.pets.map(p=>{const used=active.some(o=>o.items.some(i=>i.petId===p.id));return`<span class="chip">${esc(p.name)}<button data-action="remove-pet" data-id="${attr(p.id)}" ${used?'disabled title="已有订单使用该精灵"':''}>×</button></span>`}).join('')}</div>`:'<div class="empty-mini">暂无本赛季精灵。</div>'}
    function match(o){if(!query)return true;const q=query.toLowerCase();return[o.customer,o.note,...o.items.map(i=>i.petName)].some(v=>String(v||'').toLowerCase().includes(q))}
    function renderOrders(){
      const list=data.orders.filter(o=>(tab==='archived'?o.archived:!o.archived)&&match(o));
      if(!list.length){$('#orderList').innerHTML=`<div class="empty"><div><h2>${query?'没有匹配结果':tab==='archived'?'暂无归档记录':'暂无老板卡'}</h2><p>${query?'请更换搜索内容。':tab==='archived'?'完成的老板卡可归档至此。':'添加本赛季精灵后可新建老板卡。'}</p></div></div>`;return}
      $('#orderList').innerHTML=list.map(o=>cardHtml(o)).join('');
      document.querySelectorAll('details.order').forEach(d=>d.addEventListener('toggle',()=>{const id=d.dataset.id;if(d.open)openCards.add(id);else openCards.delete(id)}));
    }
    function cardHtml(o){const t=totals(o),pct=t.target?Math.round(t.caught/t.target*100):0,s=seasonOf(o);return`<details class="order ${tone(o.customer)}" data-id="${attr(o.id)}" ${openCards.has(o.id)?'open':''}><summary><div class="sum-top"><div style="min-width:0"><div><h3>${esc(o.customer)}</h3>${t.left===0?'<span class="done">✓ 已完成</span>':''}</div><p class="sub">${esc(s?s.name:'历史赛季')}${o.note?' · '+esc(o.note):''}</p></div><span class="arrow">⌄</span></div><div class="progress-row"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="percent">${pct}%</span></div><div class="counts"><span>已抓 ${t.caught}/${t.target}</span><b>还差 ${t.left}</b></div></summary><div class="details"><div class="card-actions">${!o.archived?`<button class="btn" data-action="edit" data-id="${attr(o.id)}">✎ 编辑订单</button>`:''}<button class="btn delete" data-action="delete" data-id="${attr(o.id)}">♲ 删除</button></div><div class="pet-rows">${o.items.map(i=>`<div class="pet-row ${i.caught>=i.target?'complete':''}"><div class="pet-info"><div class="pet-name">${ballPawHtml(i,o.id,o.archived)}<span>${esc(i.petName)}</span></div><div class="pet-meta">需求 ${i.target} · 已抓 ${i.caught} · <b>还差 ${Math.max(0,i.target-i.caught)}</b></div></div>${!o.archived?`<div class="counter"><button data-action="count" data-order="${attr(o.id)}" data-item="${attr(i.id)}" data-delta="-1" ${i.caught<=0?'disabled':''}>−</button><strong>${i.caught}</strong><button class="plus" data-action="count" data-order="${attr(o.id)}" data-item="${attr(i.id)}" data-delta="1" ${i.caught>=i.target?'disabled':''}>＋</button></div>`:''}</div>`).join('')}</div><div class="foot"><span>共 ${t.target} · 已抓 ${t.caught} · 还差 ${t.left}</span>${o.archived?`<button class="btn" data-action="restore" data-id="${attr(o.id)}">↶ 恢复</button>`:`<button class="btn" data-action="archive" data-id="${attr(o.id)}" ${t.left?'disabled':''}>▱ 归档</button>`}</div></div></details>`}
    function openOrder(id){editingId=id||null;const order=id?data.orders.find(o=>o.id===id):null;const season=order?seasonOf(order):currentSeason();if(!season)return;$('#orderTitle').textContent=order?'修改老板卡':'新建老板卡';$('#customerInput').value=order?order.customer:'';$('#noteInput').value=order?order.note:'';const old=new Map((order?order.items:[]).map(i=>[i.petId,i]));$('#orderPicks').innerHTML=season.pets.map(p=>{const item=old.get(p.id),checked=!!item;return`<label class="pick ${checked?'on':''}"><input type="checkbox" data-pet="${attr(p.id)}" ${checked?'checked':''}><span class="pick-name">${esc(p.name)}</span><input class="input qty" inputmode="numeric" pattern="[0-9]*" data-qty="${attr(p.id)}" value="${checked?item.target:''}" ${checked?'':'disabled'}><span>只</span></label>`}).join('');$('#orderPicks').querySelectorAll('[data-pet]').forEach(c=>c.addEventListener('change',()=>{const row=c.closest('.pick'),q=row.querySelector('[data-qty]');q.disabled=!c.checked;row.classList.toggle('on',c.checked);if(c.checked&&!q.value)q.value='1'}));$('#orderPicks').querySelectorAll('[data-qty]').forEach(q=>{q.addEventListener('focus',()=>q.select());q.addEventListener('input',()=>{q.value=q.value.replace(/\D/g,'').slice(0,4);if(Number(q.value)>9999)q.value='9999'})});$('#orderDialog').showModal();setTimeout(()=>$('#customerInput').focus(),50)}
    $('#orderForm').addEventListener('submit',e=>{e.preventDefault();const customer=$('#customerInput').value.trim(),note=$('#noteInput').value.trim(),order=editingId?data.orders.find(o=>o.id===editingId):null,season=order?seasonOf(order):currentSeason();const selected=[...$('#orderPicks').querySelectorAll('[data-pet]:checked')];if(!customer){toast('请填写老板名');return}if(!selected.length){toast('请至少选择一种精灵');return}const targets={};for(const c of selected){const petId=c.dataset.pet,q=$(`[data-qty="${CSS.escape(petId)}"]`).value;if(!q||Number(q)<1){toast('请填写需求数量');return}targets[petId]=Number(q)}const old=new Map((order?order.items:[]).map(i=>[i.petId,i]));const items=season.pets.filter(p=>targets[p.id]).map(p=>{const x=old.get(p.id),target=targets[p.id];return{id:x?x.id:uid(),petId:p.id,petName:p.name,target,caught:Math.min(x?x.caught:0,target),ball:x?x.ball||'':''}});if(order){order.customer=customer;order.note=note;order.items=items}else data.orders.unshift({id:uid(),seasonId:season.id,customer,note,items,archived:false,createdAt:now()});save();render();$('#orderDialog').close()});
    $('#petForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#petName').value.trim(),s=currentSeason();if(!name||s.pets.some(p=>p.name.toLowerCase()===name.toLowerCase()))return;s.pets.push({id:uid(),name});$('#petName').value='';save();render()});
    $('#newOrder').addEventListener('click',()=>{if(!currentSeason().pets.length){toast('请先添加本赛季精灵');return}openOrder()});$('#newSeason').addEventListener('click',()=>{$('#seasonInput').value='';$('#seasonDialog').showModal();setTimeout(()=>$('#seasonInput').focus(),50)});$('#seasonForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#seasonInput').value.trim();if(!name)return;const id=uid();data.seasons.push({id,name,pets:[],createdAt:now()});data.currentSeasonId=id;save();render();$('#seasonDialog').close()});
    document.addEventListener('click',e=>{const paw=e.target.closest('[data-ball-paw]');if(paw){if(!paw.disabled)openBallChooser(paw.dataset.order,paw.dataset.item);return}const ballButton=e.target.closest('[data-ball-value]');if(ballButton&&ballTarget){const o=data.orders.find(x=>x.id===ballTarget.orderId),i=o&&o.items.find(x=>x.id===ballTarget.itemId);if(i){i.ball=ballButton.dataset.ballValue;save();render()}ballTarget=null;$('#ballDialog').close();return}const close=e.target.closest('[data-close]');if(close){$('#'+close.dataset.close).close();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='remove-pet'){const s=currentSeason();s.pets=s.pets.filter(p=>p.id!==id);save();render()}else if(a==='edit')openOrder(id);else if(a==='delete'){deletingId=id;const o=data.orders.find(x=>x.id===id);$('#deleteName').textContent='“'+(o?o.customer:'')+'”';$('#deleteDialog').showModal()}else if(a==='count'){const o=data.orders.find(x=>x.id===b.dataset.order),i=o&&o.items.find(x=>x.id===b.dataset.item);if(i){i.caught=Math.max(0,Math.min(i.target,i.caught+Number(b.dataset.delta)));save();render()}}else if(a==='archive'){const o=data.orders.find(x=>x.id===id);if(o&&totals(o).left===0){o.archived=true;o.archivedAt=now();openCards.delete(id);save();render()}}else if(a==='restore'){const o=data.orders.find(x=>x.id===id);if(o){o.archived=false;delete o.archivedAt;save();render()}}});
    $('#confirmDelete').addEventListener('click',()=>{if(deletingId){data.orders=data.orders.filter(o=>o.id!==deletingId);openCards.delete(deletingId);save();render()}deletingId=null;$('#deleteDialog').close()});
    document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderOrders()}));$('#searchInput').addEventListener('input',e=>{query=e.target.value.trim();$('#clearSearch').classList.toggle('hidden',!query);renderOrders()});$('#clearSearch').addEventListener('click',()=>{$('#searchInput').value='';query='';$('#clearSearch').classList.add('hidden');renderOrders()});
    function exportBackup(){const payload={format:'xiaojiu-season-pets',version:1,exportedAt:now(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='抓宠订单备份-'+now().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('#exportBtn').addEventListener('click',exportBackup);$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const parsed=JSON.parse(await f.text()),next=parsed&&parsed.data?parsed.data:parsed;if(!valid(next))throw new Error();if(!confirm('导入会覆盖当前离线记录，确定继续吗？'))return;data=next;openCards.clear();save();render();toast('导入完成')}catch{alert('备份文件无法识别')}});
    render();
  })();
  </script>
</body>
</html>
